name: Build and deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java + Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre graphviz

      - name: Download current PlantUML release
        run: |
          curl -sL --fail -o "$HOME/plantuml.jar" \
            https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
          echo "PLANTUML_JAR=$HOME/plantuml.jar" >> "$GITHUB_ENV"

      - name: Install LaTeX toolchain (for PDF export)
        run: |
          sudo apt-get install -y \
            texlive-xetex texlive-fonts-recommended texlive-latex-recommended \
            texlive-latex-extra latexmk fonts-dejavu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx dependencies
        run: pip install -r docs/requirements.txt

      - name: Build Sphinx site
        run: sphinx-build -n -W docs/source docs/_build/html

      - name: Build PDF (best-effort; site still deploys if this fails)
        continue-on-error: true
        run: sphinx-build -M latexpdf docs/source docs/_build

      - name: Publish PDF alongside the HTML site
        run: |
          if [ -f docs/_build/latex/bash-miscellaneous.pdf ]; then
            cp docs/_build/latex/bash-miscellaneous.pdf docs/_build/html/bash-miscellaneous.pdf
          else
            echo "::warning::PDF build did not produce an output file; skipping PDF publish for this run"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
