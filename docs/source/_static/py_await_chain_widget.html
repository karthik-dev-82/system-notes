<div class="ac-root" id="acWidget">
  <style>
    #acWidget {
      --ac-bg: #0f172a;
      --ac-panel: #16213e;
      --ac-border: #2a3655;
      --ac-text: #e2e8f0;
      --ac-muted: #94a3b8;
      --ac-accent: #38bdf8;
      --ac-good: #4ade80;
      --ac-warn: #fbbf24;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--ac-bg);
      color: var(--ac-text);
      border-radius: 12px;
      padding: 20px;
      margin: 24px 0;
      box-sizing: border-box;
      overflow-x: auto;
    }
    #acWidget * { box-sizing: border-box; }
    #acWidget h3 { margin: 0 0 4px; font-size: 1.15rem; color: #fff; }
    #acWidget .ac-sub { color: var(--ac-muted); font-size: 0.85rem; margin-bottom: 12px; }

    .ac-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--ac-panel); border: 1px solid var(--ac-border); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; min-width: 900px; }
    .ac-btn { background: var(--ac-accent); color: #041322; border: none; border-radius: 7px; padding: 8px 14px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    .ac-btn.secondary { background: transparent; color: var(--ac-text); border: 1px solid var(--ac-border); font-weight: 600; }
    .ac-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .ac-tick-badge { margin-left: auto; font-family: ui-monospace, monospace; font-size: 0.8rem; color: var(--ac-warn); background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3); border-radius: 6px; padding: 6px 12px; }

    .ac-chain { display: flex; flex-direction: column; gap: 6px; min-width: 900px; margin-bottom: 16px; }
    .ac-frame { background: var(--ac-panel); border: 1px solid var(--ac-border); border-radius: 10px; padding: 12px 16px; }
    .ac-frame.done { border-color: var(--ac-good); }
    .ac-frame-head { display: flex; justify-content: space-between; align-items: center; font-family: ui-monospace, monospace; font-size: 0.82rem; font-weight: 700; }
    .ac-frame-detail { font-family: ui-monospace, monospace; font-size: 0.74rem; color: var(--ac-muted); margin-top: 6px; }
    .ac-frame-src { font-family: ui-monospace, monospace; font-size: 0.72rem; color: var(--ac-muted); white-space: pre; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--ac-border); }
    .ac-state-tag { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; }
    .ac-state-tag.idle { background: rgba(148,163,184,0.12); color: var(--ac-muted); }
    .ac-state-tag.sleeping { background: rgba(148,163,184,0.18); color: var(--ac-muted); }
    .ac-state-tag.suspended { background: rgba(56,189,248,0.18); color: var(--ac-accent); }
    .ac-state-tag.done { background: rgba(74,222,128,0.18); color: var(--ac-good); }
    .ac-arrow { text-align: center; color: var(--ac-muted); font-size: 0.9rem; }

    .ac-log { background: var(--ac-panel); border: 1px solid var(--ac-border); border-radius: 10px; padding: 14px 16px; font-family: ui-monospace, monospace; font-size: 0.74rem; color: var(--ac-muted); min-width: 900px; max-height: 200px; overflow-y: auto; }
    .ac-log-line { padding: 2px 0; border-bottom: 1px solid rgba(42,54,85,0.4); }
    .ac-empty { color: var(--ac-muted); font-size: 0.76rem; font-style: italic; }
    .ac-note { font-size: 0.76rem; color: var(--ac-muted); line-height: 1.5; margin-top: 12px; }
  </style>

  <h3>await Chains Through</h3>
  <div class="ac-sub"><code>outer</code> awaits <code>middle</code>, which awaits <code>inner</code>. Step through it and watch control pass all the way down before anything runs, then the return value carry all the way back up -- <code>await</code> doesn't block, it delegates.</div>

  <div class="ac-controls">
    <button class="ac-btn" id="acStepBtn">Step one tick</button>
    <button class="ac-btn secondary" id="acRunBtn">Run to completion</button>
    <button class="ac-btn secondary" id="acResetBtn">Reset</button>
    <div class="ac-tick-badge" id="acTickBadge">tick 0</div>
  </div>

  <div class="ac-chain" id="acChain"></div>

  <div class="ac-log" id="acLog"></div>
  <div class="ac-note" id="acNote"></div>

  <script>
  (function() {
    var root = document.getElementById('acWidget');

    // --- Model: identical to the standalone Node-verified state machine.
    // outer() awaits middle() awaits inner() as BARE coroutines (no
    // separate asyncio.Task per frame). Real asyncio drives that whole
    // chain as ONE task -- JS's `yield*` generator delegation is the
    // structural equivalent of Python's await-chaining, not a convenient
    // trick standing in for it. ---

    var SLEEP_TICKS = 3;

    function makeChainGenerator(log) {
      function* innerGen() {
        log.push({ id: 'inner', text: 'awaits sleep(' + SLEEP_TICKS + ')' });
        yield { type: 'sleep', ticks: SLEEP_TICKS };
        log.push({ id: 'inner', text: 'finished its sleep(' + SLEEP_TICKS + ')' });
        return 'inner-result';
      }
      function* middleGen() {
        log.push({ id: 'middle', text: 'awaits inner()' });
        var received = yield* innerGen();
        log.push({ id: 'middle', text: 'received "' + received + '" from inner' });
        return received + ' -> relayed by middle';
      }
      function* outerGen() {
        log.push({ id: 'outer', text: 'awaits middle()' });
        var received = yield* middleGen();
        log.push({ id: 'outer', text: 'received "' + received + '" from middle' });
        return received + ' -> relayed by outer';
      }
      return outerGen();
    }

    function makeTask() {
      var log = [];
      var gen = makeChainGenerator(log);
      return { gen: gen, log: log, state: 'ready', wakeAtTick: 0, result: undefined };
    }

    function runOneTick(task, tick) {
      if (task.state === 'sleeping' && task.wakeAtTick <= tick) task.state = 'ready';
      if (task.state !== 'ready') return [];
      var startLen = task.log.length;
      var r = task.gen.next();
      var entries = task.log.slice(startLen).map(function(e) { return { tick: tick, id: e.id, text: e.text }; });
      if (r.done) {
        task.state = 'done';
        task.result = r.value;
        entries.push({ tick: tick, id: 'outer', text: 'chain finished, returned "' + r.value + '"' });
      } else if (r.value.type === 'sleep') {
        task.state = 'sleeping';
        task.wakeAtTick = tick + r.value.ticks;
      }
      return entries;
    }

    var FRAMES = [
      { id: 'inner', label: 'inner()', src: 'async def inner():\n    await asyncio.sleep(' + SLEEP_TICKS + ')\n    return "inner-result"' },
      { id: 'middle', label: 'middle()', src: 'async def middle():\n    r = await inner()\n    return r + " -> relayed by middle"' },
      { id: 'outer', label: 'outer()', src: 'async def outer():\n    r = await middle()\n    return r + " -> relayed by outer"' }
    ];

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Per-frame display state, derived from the shared log -- there is only
    // ONE scheduled task underneath; this is purely for showing each frame's
    // individual status, not a separate scheduling mechanism.
    function frameStateFor(id, log) {
      var started = log.some(function(e) { return e.id === id && e.text.indexOf('awaits') === 0; });
      var finished = log.some(function(e) {
        return e.id === id && (e.text.indexOf('finished') === 0 || e.text.indexOf('received') === 0);
      });
      if (finished) return 'done';
      if (started) return id === 'inner' ? 'sleeping' : 'suspended';
      return 'idle';
    }

    function detailFor(id, frameState, task, log) {
      if (frameState === 'sleeping') return 'sleeping, wakes at tick ' + task.wakeAtTick;
      if (frameState === 'suspended') return 'delegated to its callee -- not doing anything, not polled again until it returns';
      if (frameState === 'done') {
        var entry = log.slice().reverse().find(function(e) { return e.id === id; });
        return entry ? 'done at tick ' + entry.tick + ' -- ' + entry.text : 'done';
      }
      return 'not started yet';
    }

    // state.log is the tick-stamped display log (what render() shows);
    // state.task.log is the raw, un-stamped log the generators push into,
    // used only by runOneTick's internal diffing -- they are deliberately
    // two different arrays with the same underlying entries.
    var state = { task: null, tick: 0, log: [] };

    var chainEl = document.getElementById('acChain');
    var logEl = document.getElementById('acLog');
    var tickBadge = document.getElementById('acTickBadge');
    var noteEl = document.getElementById('acNote');

    function reset() {
      state.task = makeTask();
      state.tick = 0;
      state.log = [];
      render();
    }

    function stepOnce() {
      if (state.task.state === 'done') return;
      var entries = runOneTick(state.task, state.tick);
      state.log = state.log.concat(entries);
      state.tick += 1;
      render();
    }

    function runToCompletion() {
      var guard = 0;
      while (state.task.state !== 'done' && guard < 1000) { stepOnce(); guard += 1; }
    }

    function render() {
      tickBadge.textContent = 'tick ' + state.tick;

      chainEl.innerHTML = FRAMES.map(function(f, i) {
        var frameState = frameStateFor(f.id, state.log);
        var html = '<div class="ac-frame' + (frameState === 'done' ? ' done' : '') + '">' +
          '<div class="ac-frame-head"><span>' + f.label + '</span><span class="ac-state-tag ' + frameState + '">' + frameState + '</span></div>' +
          '<div class="ac-frame-detail">' + detailFor(f.id, frameState, state.task, state.log) + '</div>' +
          '<div class="ac-frame-src">' + escapeHtml(f.src) + '</div>' +
          '</div>';
        if (i < FRAMES.length - 1) html += '<div class="ac-arrow">&uarr; awaited by</div>';
        return html;
      }).join('');

      logEl.innerHTML = state.log.map(function(e) {
        return '<div class="ac-log-line">tick ' + e.tick + ', <b>' + e.id + '</b>: ' + e.text + '</div>';
      }).join('') || '<span class="ac-empty">Click "Step one tick" to start.</span>';

      var done = state.task.state === 'done';
      document.getElementById('acStepBtn').disabled = done;
      document.getElementById('acRunBtn').disabled = done;
    }

    document.getElementById('acStepBtn').addEventListener('click', stepOnce);
    document.getElementById('acRunBtn').addEventListener('click', runToCompletion);
    document.getElementById('acResetBtn').addEventListener('click', reset);

    noteEl.textContent = 'Notice all three frames finish on the exact same tick (' + SLEEP_TICKS + ') that inner\u2019s sleep elapses -- not one tick apart. Chaining bare await calls costs nothing extra: once inner\u2019s real suspension point resolves, control unwinds straight back up through middle and outer synchronously, in one step, because they were never separately scheduled tasks to begin with -- only inner\u2019s sleep was ever a real suspension point.';

    reset();
  })();
  </script>
</div>
